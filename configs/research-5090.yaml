# Compatibility configuration for primary SpikeWeave-EEG-M (12 x 512).
# Use research-l.yaml explicitly for the later 24 x 1024 capacity comparison.
model:
  channels: 16
  samples: 1024
  sample_rate: 256.0
  wavelet: db4
  wavelet_levels: 3
  waveform_patch: 16
  coefficient_patch: 16
  dim: 512
  encoder_depth: 8
  heads: 8
  structure_base_dim: 32
  structure_depths:
  - 2
  - 2
  - 2
  structure_window: 4
  structure_frequency_patch: 4
  structure_time_patch: 8
  structure_frequency_bins: 2
  condition_time_bins: 4
  cwt_frequencies: 64
  cwt_times: 128
  cwt_min_frequency: 2.0
  cwt_max_frequency: 80.0
  text_backend: offline
  text_model_name: microsoft/BiomedNLP-BiomedBERT-base-uncased-abstract
  text_local_files_only: true
  freeze_text: true
  text_vocab_size: 4096
  text_max_length: 256
  text_depth: 12
  fusion_depth: 6
  attribute_dim: 16
  denoiser_dim: 512
  denoiser_heads: 8
  denoiser_depth: 12
  dropout: 0.0
  projection_dim: 512
  lead_names:
  - FP1-F7
  - F7-T7
  - T7-P7
  - P7-O1
  - FP2-F8
  - F8-T8
  - T8-P8
  - P8-O2
  - FP1-F3
  - F3-C3
  - C3-P3
  - P3-O1
  - FP2-F4
  - F4-C4
  - C4-P4
  - P4-O2
  condition_dim: 768
  condition_heads: 12
  projection_hidden_dim: 1024
  snn_chunk_sizes:
  - 4
  - 4
  - 4
  - 4
  - 8
  - 8
  - 8
  - 8
  snn_drop_path: 0.1
  representation_dropout: 0.1
  frontend_backend: biomedclip
  biomedclip_checkpoint: microsoft/BiomedCLIP-PubMedBERT_256-vit_base_patch16_224
  biomedclip_local_path: weights/BiomedCLIP
  frontend_text_config_path: null
  visual_depth: 12
  visual_heads: 12
  visual_patch: 16
  image_summary_tokens: 8
  montage_mode: audit
  montage_residual_tolerance: 0.01
training:
  stage: diffusion
  learning_rate: 5.0e-05
  mixed_precision: true
  gradient_accumulation: 64
  effective_batch_size: 256
  warmup_steps: 5000
  total_steps: 100000
  ema_decay: 0.9999
