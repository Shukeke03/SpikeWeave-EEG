[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spikeweave-eeg"
version = "0.1.0"
description = "SpikeWeave-EEG: dual-branch spiking EEG and vision-language wavelet diffusion research"
requires-python = ">=3.11"
dependencies = [
  "torch>=2.8,<3",
  "numpy>=1.26,<3",
  "scipy>=1.13,<2",
  "PyWavelets>=1.8,<2",
  "PyYAML>=6,<7",
  "mne>=1.8,<2",
  "transformers>=4.57,<5",
  "safetensors>=0.4",
]

[project.optional-dependencies]
dev = ["pytest>=8.4,<9", "ruff>=0.12", "edfio>=0.4,<0.5"]

[project.scripts]
spikeweave = "triwave.cli:main"
triwave = "triwave.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
